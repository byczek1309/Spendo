  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4d9"/><stop offset="0.26" stop-color="#f3dba9"/><stop offset="0.65" stop-color="#d7ad65"/><stop offset="1" stop-color="#9c6c38"/></linearGradient>
